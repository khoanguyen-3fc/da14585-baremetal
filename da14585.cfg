# https://github.com/google/pebble/blob/master/src/bluetooth-fw/da1468x/openocd.cfg
# https://github.com/phatware/canres/blob/master/da1468X/SDK_1.0.14.1081/utilities/scripts/openocd/da168x.cfg
# https://github.com/openocd-org/openocd/blob/master/tcl/target/nrf51.cfg

# DA14585 target config (Cortex-M0), adapter selected externally, e.g.:
#   openocd -f interface/jlink.cfg -c 'transport select swd' -f da14585.cfg -c "init; halt; reset; shutdown"
#   openocd -f interface/stlink.cfg -f da14585.cfg -c "init; halt; reset; shutdown"
#   openocd -f interface/cmsis-dap.cfg -f da14585.cfg -c "init; halt; reset; resume; shutdown"
# `resume` is adapter-specific: some CMSIS-DAP stay halted after reset and need
# it; others run automatically -- drop `resume` there, or it warns
# "Warn : [da14585.cpu] target not halted" (core already running; harmless).

source [find target/swj-dp.tcl]

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME da14585
}

if { [info exists CPUTAPID] } {
    set _CPUTAPID $CPUTAPID
} else {
    set _CPUTAPID 0x0bb11477
}

swj_newdap $_CHIPNAME cpu -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

if {![using_hla]} {
   # The chip supports standard ARM/Cortex-M0 SYSRESETREQ signal
   cortex_m reset_config sysresetreq
}

#  The chip should start up from internal 16Mhz RC, so setting adapter
#  clock to 1Mhz should be OK
adapter speed 1000
