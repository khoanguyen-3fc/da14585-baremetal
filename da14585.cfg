# https://github.com/google/pebble/blob/master/src/bluetooth-fw/da1468x/openocd.cfg
# https://github.com/phatware/canres/blob/master/da1468X/SDK_1.0.14.1081/utilities/scripts/openocd/da168x.cfg
# https://github.com/openocd-org/openocd/blob/master/tcl/target/nrf51.cfg

source [find interface/jlink.cfg]
# source [find interface/cmsis-dap.cfg]

transport select swd
# transport select jtag

source [find target/swj-dp.tcl]

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME da14585
}

if { [info exists ENDIAN] } {
   set _ENDIAN $ENDIAN
} else {
   set _ENDIAN little
}

# Work-area is a space in RAM used for flash programming
# By default use 16kB
if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x4000
}

if { [info exists CPUTAPID] } {
    set _CPUTAPID $CPUTAPID
} else {
    set _CPUTAPID 0x0bb11477
}

swj_newdap $_CHIPNAME cpu -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x07FD0000 -work-area-size $_WORKAREASIZE -work-area-backup 0
# $_TARGETNAME configure -work-area-phys 0x7FC0000 -work-area-size $_WORKAREASIZE -work-area-backup 0

adapter speed 1000

cortex_m reset_config sysresetreq
